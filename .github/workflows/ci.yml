name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        shell: pwsh
        run: ./scripts/lint.ps1
      - name: Verify dist is up to date
        shell: pwsh
        run: ./scripts/build.ps1 -Check